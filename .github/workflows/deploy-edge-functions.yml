name: Deploy Supabase (migrations + edge functions)

on:
  push:
    branches:
      - main
      - claude/terrawatch-redesign-dMM0l
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Apply migrations and deploy functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy ask-terra
        run: supabase functions deploy ask-terra --no-verify-jwt=false

      # Phase 9.0.1 — per-source ingest functions. Each is invoked by pg_cron
      # via the shared `x-ingest-secret` header (no Supabase JWT).
      - name: Deploy ingest-seismic
        run: supabase functions deploy ingest-seismic --no-verify-jwt=true

      - name: Deploy ingest-weather
        run: supabase functions deploy ingest-weather --no-verify-jwt=true

      - name: Deploy ingest-space
        run: supabase functions deploy ingest-space --no-verify-jwt=true

      - name: Deploy ingest-wildfires
        run: supabase functions deploy ingest-wildfires --no-verify-jwt=true

      - name: Deploy ingest-volcanoes
        run: supabase functions deploy ingest-volcanoes --no-verify-jwt=true

      - name: Deploy ingest-gdacs
        run: supabase functions deploy ingest-gdacs --no-verify-jwt=true

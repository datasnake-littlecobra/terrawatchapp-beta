name: Deploy Supabase (migrations + edge functions)

on:
  push:
    branches:
      - main
      - claude/terrawatch-redesign-dMM0l
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Apply migrations and deploy functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy ask-terra
        run: supabase functions deploy ask-terra --no-verify-jwt=false

      - name: Deploy ask-terra-chat
        run: supabase functions deploy ask-terra-chat --no-verify-jwt=false

      # Phase 9.9 — admin-only AI blog generator. JWT-gated; the function
      # itself also checks user_profiles.role='admin' before calling
      # Anthropic, so a non-admin JWT will get a 403.
      - name: Deploy generate-blog
        run: supabase functions deploy generate-blog --no-verify-jwt=false

      # Phase 9.8 follow-up — single-call admin signup. Anonymous endpoint
      # (the admin signup code is the gating factor); skips Supabase's
      # email-confirmation friction by creating users with email_confirm=true.
      - name: Deploy signup-admin
        run: supabase functions deploy signup-admin --no-verify-jwt=true

      # Phase 9.0.1 — per-source ingest functions. Each is invoked by pg_cron
      # via the shared `x-ingest-secret` header (no Supabase JWT).
      - name: Deploy ingest-seismic
        run: supabase functions deploy ingest-seismic --no-verify-jwt=true

      - name: Deploy ingest-weather
        run: supabase functions deploy ingest-weather --no-verify-jwt=true

      - name: Deploy ingest-space
        run: supabase functions deploy ingest-space --no-verify-jwt=true

      - name: Deploy ingest-wildfires
        run: supabase functions deploy ingest-wildfires --no-verify-jwt=true

      - name: Deploy ingest-volcanoes
        run: supabase functions deploy ingest-volcanoes --no-verify-jwt=true

      - name: Deploy ingest-gdacs
        run: supabase functions deploy ingest-gdacs --no-verify-jwt=true

      - name: Deploy ingest-smithsonian
        run: supabase functions deploy ingest-smithsonian --no-verify-jwt=true

      - name: Deploy ingest-nhc
        run: supabase functions deploy ingest-nhc --no-verify-jwt=true

      - name: Deploy ingest-openaq
        run: supabase functions deploy ingest-openaq --no-verify-jwt=true

      - name: Deploy ingest-ndbc
        run: supabase functions deploy ingest-ndbc --no-verify-jwt=true

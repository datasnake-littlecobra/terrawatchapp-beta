name: Nightly health check

# Phase 9.10 Tier B — lightweight curl-based smoke test of the live site.
# Runs nightly + on-demand. Pings critical surfaces, queries Supabase
# PostgREST for basic data freshness, posts a Markdown report into the
# workflow run's Step Summary so the user can read it from the Actions
# tab without leaving GitHub.
#
# Why curl, not Playwright: JS-rendering tests need browsers in CI which
# inflates run time + complexity. The curl approach catches what
# matters operationally (URLs alive, OG worker injecting, ingesters
# reporting, RPCs returning) at a tiny fraction of the cost. Once the
# product surface stabilizes, layer Playwright on top.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (~midnight US Pacific)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL:           ${{ vars.HEALTH_CHECK_BASE_URL || 'https://hyperlocalwatch.com' }}
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL_PUBLIC }}
      SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY_PUBLIC }}
    steps:
      - name: Initialize report
        run: |
          {
            echo "# TerraWatch Nightly Health Report"
            echo
            echo "**Run time (UTC):** $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "**Base URL:** \`$BASE_URL\`"
            echo
            echo "| Check | Status | Detail |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Page reachability
        id: pages
        run: |
          set +e
          fail=0
          for path in "/" "/events" "/alerts" "/blog" "/monitoring/ocean" \
                     "/research/atmosphere" "/research/ocean" "/research/seismic-hazard"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL$path")
            if [ "$code" = "200" ]; then
              echo "| GET $path | ✅ | $code |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| GET $path | ❌ | $code |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit $fail

      - name: OG injector check (blog)
        run: |
          # Use the seeded post slug. If the worker is wired correctly, og:title
          # contains "Why we built TerraWatch" — otherwise the index.html default.
          html=$(curl -s --max-time 15 "$BASE_URL/blog/why-we-built-terrawatch")
          if echo "$html" | grep -q 'property="og:title" content="Why we built TerraWatch'; then
            echo "| OG worker injection | ✅ | per-post og:title detected |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| OG worker injection | ❌ | per-post og:title NOT detected — check Worker env vars |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Supabase reachability + research counters
        if: env.SUPABASE_URL != ''
        run: |
          # Hits the public research_counters() RPC — proves PostgREST is up
          # AND the events / measurements pipelines have data.
          json=$(curl -s --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/rpc/research_counters")
          if echo "$json" | grep -q 'aq_stations_24h'; then
            echo "| research_counters RPC | ✅ | $(echo "$json" | tr -d '\n' | head -c 180)… |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| research_counters RPC | ❌ | unexpected response: $(echo "$json" | head -c 200) |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Per-source freshness via events_recent
        if: env.SUPABASE_URL != ''
        run: |
          # Pull latest 5 events; ensure occurred_at within the last 24h.
          json=$(curl -s --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/rpc/events_recent?max_rows=5&since_hours=24")
          count=$(echo "$json" | grep -o 'occurred_at' | wc -l)
          if [ "$count" -ge 1 ]; then
            echo "| events freshness (24h) | ✅ | $count rows in latest payload |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| events freshness (24h) | ⚠️ | no events in last 24h — check ingest health |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Closing footer
        if: always()
        run: |
          {
            echo
            echo "---"
            echo "_Generated by \`.github/workflows/nightly-health-check.yml\`_"
          } >> "$GITHUB_STEP_SUMMARY"

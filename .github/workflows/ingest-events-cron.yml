name: Ingest events (manual)

# Manual / on-demand ingest. The scheduled hourly cadence lives in pg_cron
# inside Supabase (migration 0007) — GitHub Actions' `schedule` trigger was
# flaky (delayed activation, throttling under load). Keep this workflow for
# hand-triggered reingest: Actions tab → Ingest events (manual) → Run workflow.
#
# Phase 9.0.1: calls all 5 per-source functions sequentially. Each is
# independent — a failure in one does not stop the others.

on:
  workflow_dispatch:

concurrency:
  group: ingest-events
  cancel-in-progress: false

jobs:
  ingest:
    name: Trigger all ingest sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
    steps:
      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$INGEST_SECRET" ]; then
            echo "Missing SUPABASE_PROJECT_REF or INGEST_SECRET secret" >&2
            exit 1
          fi

      - name: ingest-seismic
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ingest-seismic"
          echo "POST ${URL}"
          HTTP_STATUS=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            -H "content-type: application/json" \
            --data '{}')
          echo "HTTP $HTTP_STATUS"; cat /tmp/out.json; echo
          [ "$HTTP_STATUS" -lt 300 ] || exit 1

      - name: ingest-weather
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ingest-weather"
          echo "POST ${URL}"
          HTTP_STATUS=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            -H "content-type: application/json" \
            --data '{}')
          echo "HTTP $HTTP_STATUS"; cat /tmp/out.json; echo
          [ "$HTTP_STATUS" -lt 300 ] || exit 1

      - name: ingest-space
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ingest-space"
          echo "POST ${URL}"
          HTTP_STATUS=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            -H "content-type: application/json" \
            --data '{}')
          echo "HTTP $HTTP_STATUS"; cat /tmp/out.json; echo
          [ "$HTTP_STATUS" -lt 300 ] || exit 1

      - name: ingest-wildfires
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ingest-wildfires"
          echo "POST ${URL}"
          HTTP_STATUS=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            -H "content-type: application/json" \
            --data '{}')
          echo "HTTP $HTTP_STATUS"; cat /tmp/out.json; echo
          [ "$HTTP_STATUS" -lt 300 ] || exit 1

      - name: ingest-volcanoes
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ingest-volcanoes"
          echo "POST ${URL}"
          HTTP_STATUS=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            -H "content-type: application/json" \
            --data '{}')
          echo "HTTP $HTTP_STATUS"; cat /tmp/out.json; echo
          [ "$HTTP_STATUS" -lt 300 ] || exit 1
